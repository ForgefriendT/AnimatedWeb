[build]
  # Command to build your site
  command = "npm run build"
  
  # Directory that contains the deploy-ready HTML files and assets
  publish = "dist"

# Redirect all requests to index.html for single-page app routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: Set node version
[build.environment]
  NODE_VERSION = "20"
